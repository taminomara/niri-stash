[package]
name = "niri-stash"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Stash floating windows on niri into slivers at the screen edge and bring them back."
publish = false

[dependencies]
niri-ipc = "=26.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
rustix = { version = "1.1.5", features = ["event"] }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
